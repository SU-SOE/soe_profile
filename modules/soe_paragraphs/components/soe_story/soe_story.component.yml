'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json'
name: SOE Story
status: stable
group: SOE
props:
  type: object
  properties:
    header_tag:
      type: string
      title: Header Tag
      enum:
        - h2
        - h3
        - h4
        - div
    header_classes:
      type: string
      title: Header Classes
      examples: [ ]
    border_color:
      type: [string, integer]
      title: Border Color
      enum:
        - 1
        - 2
        - 3
      meta:enum:
        1: Turquoise
        2: Pink
        3: Orange
    name:
      type: string
      title: Name
      examples: []
    title:
      type: string
      title: Title or Dept
      examples: []
    quote:
      type: string
      title: Quote
      examples: []
    story_link_url:
      type: string
      title: Story URL
      examples: []
    story_link_text:
      type: string
      title: Story Link Text
      examples: []
    cta_link_url:
      type: string
      title: CTA Link URL
      examples: []
    cta_link_title:
      type: string
      title: CTA Link Title
      examples: []
slots:
  image:
    title: image
